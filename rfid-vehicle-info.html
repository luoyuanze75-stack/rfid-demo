  <script>
    (function () {
      'use strict';

      var qs = window.location.search;
      if ((!qs || qs === '?') && window.location.hash.length > 1) {
        qs = '?' + window.location.hash.slice(1);
      }
      var parameters = new URLSearchParams(qs);
      var plate = parameters.get('plate') || '赣ALS3934';
      var owner = (parameters.get('name') || '周').replace(/\*+$/, '') + '**';
      var joinTime = parameters.get('joinTime') || '2025-10-11 22:46:20';
      var watermarkLayer = document.getElementById('watermarks');
      var securityImage = document.getElementById('security-image');
      var securityPlate = document.getElementById('security-plate');
      var securityTime = document.getElementById('security-time');
      var watermarkTimes = [];
      var svgNS = 'http://www.w3.org/2000/svg';

      document.getElementById('plate').textContent = plate;
      document.getElementById('owner').textContent = owner;
      document.getElementById('join-time').textContent = joinTime;
      var province = document.createElement('span');
      province.className = 'security-province';
      province.textContent = plate.charAt(0);
      securityPlate.textContent = '';
      securityPlate.appendChild(province);
      securityPlate.appendChild(document.createTextNode(plate.slice(1)));
      securityImage.setAttribute('aria-label', plate + ' 防伪图片');

      // Shift the UTC timestamp by eight hours, then use UTC getters.
      // This stays in Beijing time regardless of the device's time zone.
      function beijingTime(timestamp) {
        var date = new Date((timestamp === undefined ? Date.now() : timestamp) + 8 * 60 * 60 * 1000);
        function pad(value) { return String(value).padStart(2, '0'); }
        return date.getUTCFullYear() + '-' + pad(date.getUTCMonth() + 1) + '-' + pad(date.getUTCDate()) +
          ' ' + pad(date.getUTCHours()) + ':' + pad(date.getUTCMinutes()) + ':' + pad(date.getUTCSeconds());
      }

      function updateTime() {
        var current = beijingTime();
        var iso = current.replace(' ', 'T') + '+08:00';
        watermarkTimes.forEach(function (element) {
          element.textContent = current;
          element.setAttribute('datetime', iso);
        });
        securityTime.textContent = current;
        securityTime.setAttribute('datetime', iso);
      }

      function createWatermarks() {
        var width = document.documentElement.clientWidth;
        var height = Math.max(window.innerHeight, document.documentElement.clientHeight);
        var spacingX = 200;
        var spacingY = 200;
        var columns = Math.ceil(width / spacingX) + 1;
        var rows = Math.ceil(height / spacingY) + 1;
        var fragment = document.createDocumentFragment();
        watermarkTimes = [];

        for (var row = 0; row < rows; row++) {
          for (var column = -1; column < columns; column++) {
            var watermark = document.createElement('div');
            var plateLine = document.createElement('span');
            var timeLine = document.createElement('time');
            watermark.className = 'watermark';
            watermark.style.left = (36 + column * spacingX) + 'px';
            watermark.style.top = (54 + row * spacingY) + 'px';
            plateLine.textContent = plate;
            watermark.appendChild(plateLine);
            watermark.appendChild(timeLine);
            fragment.appendChild(watermark);
            watermarkTimes.push(timeLine);
          }
        }
        watermarkLayer.textContent = '';
        watermarkLayer.appendChild(fragment);
        updateTime();
      }

      function svgElement(name, attributes) {
        var element = document.createElementNS(svgNS, name);
        Object.keys(attributes).forEach(function (key) {
          element.setAttribute(key, attributes[key]);
        });
        return element;
      }

      function drawSecurityPattern() {
        var width = securityImage.clientWidth;
        var height = securityImage.clientHeight;
        var svg = document.getElementById('security-pattern');
        var circles = document.getElementById('security-circles');
        var lines = document.getElementById('security-lines');
        var waves = document.getElementById('security-waves');
        svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
        document.getElementById('security-ink').setAttribute('x2', width);
        document.getElementById('security-wave-ink').setAttribute('x2', width);
        circles.textContent = '';
        lines.textContent = '';
        waves.textContent = '';

        // Three staggered rows of hollow circles, with transparent paper.
        for (var row = 0; row < 3; row++) {
          for (var x = 7 + (row % 2) * 9; x < width + 15; x += 18) {
            circles.appendChild(svgElement('circle', {
              cx: x, cy: 7 + row * 20, r: 6.7,
              stroke: 'url(#security-ink)'
            }));
          }
        }

        // The reference's long lines are straight and cross at the centre.
        for (var index = 0; index < 6; index++) {
          var edge = -4 + index * 2.5;
          lines.appendChild(svgElement('line', {
            x1: 0, y1: edge, x2: width, y2: height - edge
          }));
          lines.appendChild(svgElement('line', {
            x1: 0, y1: height - edge, x2: width, y2: edge
          }));
        }
        for (var ray = 0; ray < 4; ray++) {
          var inset = width * (0.17 + ray * 0.09);
          lines.appendChild(svgElement('line', {
            x1: inset, y1: -2, x2: width - inset, y2: height + 2
          }));
          lines.appendChild(svgElement('line', {
            x1: width - inset, y1: -2, x2: inset, y2: height + 2
          }));
        }
        lines.appendChild(svgElement('line', {
          x1: 0, y1: 18, x2: width, y2: 18, stroke: '#4f65ce'
        }));

        // Keep only the short repeating waves visible in the reference.
        for (var wave = 0; wave < 4; wave++) {
          var path = '';
          var amplitude = 9;
          var period = 18;
          var centre = 24 + wave * 2;
          for (var px = 0; px <= width + 2; px += 2) {
            var py = centre + amplitude * Math.sin(px * Math.PI * 2 / period + wave * 0.7);
            path += (px === 0 ? 'M' : 'L') + px + ' ' + py.toFixed(2) + ' ';
          }
          waves.appendChild(svgElement('path', {
            d: path,
            stroke: 'url(#security-wave-ink)'
          }));
        }

        // Use the reference image's regular-weight plate lettering.
        securityPlate.style.fontSize = '26px';
        var textWidth = securityPlate.scrollWidth;
        if (textWidth > width - 36) {
          securityPlate.style.fontSize = Math.max(1, 26 * (width - 40) / textWidth) + 'px';
        }
      }

      function refreshLayout() {
        createWatermarks();
        drawSecurityPattern();
      }

      refreshLayout();
      window.setInterval(updateTime, 1000);
      window.addEventListener('resize', refreshLayout);
      window.addEventListener('pageshow', updateTime);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) updateTime();
      });
    }());
  </script>
</body>
</html>
